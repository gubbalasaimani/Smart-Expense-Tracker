{% extends 'expenses/base.html' %}

{% block content %}

<h2>Categories</h2>

<table class="table table-bordered">

<tr>
    <th>ID</th>
    <th>Name</th>
</tr>

{% for category in categories %}

<tr>
    <td>{{ category.id }}</td>
    <td>{{ category.name }}</td>
</tr>

{% empty %}

<tr>
    <td colspan="2">No Categories Found</td>
</tr>

{% endfor %}

</table>

{% endblock %}
